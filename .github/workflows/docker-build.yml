name: Build and Deploy to Digital Ocean

on:
  push:
    branches: [ master ]

env:
  REGISTRY: ghcr.io

jobs:
  build-jar:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: backend/pom.xml

      - name: Build jar (skip tests)
        working-directory: backend
        run: mvn --batch-mode -s maven-settings.xml -DskipTests package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 1

  build-and-push:
    needs: build-jar
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: spider-birthday-backend
            context: ./backend
            image: goodidea-solutions/spider-birthday-backend
            needs_jar: true
          - name: spider-birthday-frontend
            context: ./frontend
            image: goodidea-solutions/spider-birthday-frontend
            needs_jar: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download jar
        if: matrix.needs_jar
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short

      - name: Build and push ${{ matrix.name }} Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ matrix.image }}:latest
          cache-to: type=inline

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy compose & nginx files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DIGITALOCEAN_HOST }}
          username: ${{ secrets.DIGITALOCEAN_USERNAME }}
          key: ${{ secrets.DIGITALOCEAN_SSH_KEY }}
          port: ${{ secrets.DIGITALOCEAN_PORT }}
          source: "infra/docker-compose.prod.yml,infra/nginx-spider-birthday.conf"
          target: "/opt/spider-birthday"
          strip_components: 1

      - name: Create environment file and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DIGITALOCEAN_HOST }}
          username: ${{ secrets.DIGITALOCEAN_USERNAME }}
          key: ${{ secrets.DIGITALOCEAN_SSH_KEY }}
          port: ${{ secrets.DIGITALOCEAN_PORT }}
          script: |
            mkdir -p /opt/spider-birthday
            cd /opt/spider-birthday

            # Criar arquivo .env se não existir (edite manualmente após o primeiro deploy)
            if [ ! -f .env ]; then
              echo "REGISTRY=ghcr.io" > .env
              echo "DB_NAME=aniversario" >> .env
              echo "DB_USERNAME=aniversario" >> .env
              echo "DB_PASSWORD=change-this-password-in-production" >> .env
              echo "APP_ADMIN_TOKEN=change-this-admin-token-in-production" >> .env
              echo "APP_CORS_ORIGINS=https://spider-birthday.goodidea.com.br" >> .env
              echo "APP_PUBLIC_BASE_URL=https://spider-birthday.goodidea.com.br/uploads" >> .env
              echo "CLOUDINARY_CLOUD_NAME=" >> .env
              echo "CLOUDINARY_API_KEY=" >> .env
              echo "CLOUDINARY_API_SECRET=" >> .env
              echo "CLOUDINARY_FOLDER=spider-birthday" >> .env
            fi

            # Verificar se a rede compartilhada do nginx existe
            docker network inspect nginx_gi-network || echo "Rede nginx_gi-network não encontrada. Certifique-se de que o stack nginx em /opt/nginx está rodando."

            # Login no registry do GitHub
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull das novas imagens e restart
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d

            # Aguardar aplicação estar pronta
            sleep 30

            # Verificar status
            docker compose -f docker-compose.prod.yml ps
            docker compose -f docker-compose.prod.yml logs --tail=50
