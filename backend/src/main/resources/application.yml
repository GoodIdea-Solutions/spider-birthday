server:
  port: 8080

spring:
  application:
    name: spider-birthday
  datasource:
    url: jdbc:postgresql://localhost:5432/aniversario
    username: aniversario
    password: aniversario
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB
  config:
    import: optional:classpath:party-config.yml

app:
  admin-token: ${APP_ADMIN_TOKEN:troque-este-token}
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:4200}
  storage:
    upload-dir: ${APP_UPLOAD_DIR:uploads}
    public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080/uploads}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.aniversario: INFO
