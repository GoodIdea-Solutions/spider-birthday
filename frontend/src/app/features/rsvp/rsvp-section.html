<section id="rsvp" class="section rsvp">
  <div class="section-inner">
    <h2>Confirmar presença</h2>
    <p class="section-lead">Aceite a missão e diga quantos heróis vão aparecer!</p>

    @if (success()) {
      <div class="success-banner" role="status">
        <strong>MISSÃO ACEITA!</strong>
        <p>Presença confirmada. Nos vemos na base da operação!</p>
      </div>
    }

    <form class="rsvp-form" [formGroup]="form" (ngSubmit)="submit()">
      <label>
        Nome do herói / heroína
        <input formControlName="nome" type="text" placeholder="Ex.: Nome" />
      </label>

      <div class="row">
        <label>
          Adultos
          <input formControlName="quantidadeAdultos" type="number" min="0" />
        </label>
        <label>
          Crianças
          <input formControlName="quantidadeCriancas" type="number" min="0" />
        </label>
      </div>

      <label>
        Telefone (opcional)
        <input formControlName="telefone" type="tel" placeholder="(00) 00000-0000" />
      </label>

      @if (error()) {
        <p class="error" role="alert">{{ error() }}</p>
      }

      <button type="submit" [disabled]="loading()">
        {{ loading() ? 'Enviando...' : 'ACEITAR ESSA MISSÃO' }}
      </button>
    </form>
  </div>
</section>
