<section class="convite" aria-labelledby="convite-title">
  <h1 id="convite-title" class="visually-hidden">Convite de Samuel — 3 anos</h1>

  <div class="convite-art">
    <img
      src="/assets/convite-samuel.png"
      width="682"
      height="1024"
      alt="Convite da festa de 3 anos do Samuel, tema Homem-Aranha. 14 de novembro de 2026, das 17h às 21h, no Salão de Festas do Condomínio Residencial Siena, em Águas Claras."
    />
  </div>

  <div class="convite-cta">
    @if (textoPrazo()) {
      <p class="convite-deadline">{{ textoPrazo() }}</p>
    }
    @if (confirmacaoAberta()) {
      <p class="convite-hint">Toque no botão vermelho para dizer que vem à festa</p>
      <button type="button" class="convite-btn" (click)="openRsvp()">Confirmar presença</button>
    } @else {
      <p class="convite-hint">{{ mensagemEncerrada() }}</p>
    }
    <a routerLink="/" class="convite-site">Ver o site da festa</a>
  </div>
</section>
