@for (spider of spiders; track spider.id) {
  <div
    class="spider-drop"
    [class.spider-drop--left]="spider.id === 'left'"
    [class.spider-drop--right]="spider.id === 'right'"
    [class.flee]="fled()[spider.id]"
  >
    <span class="silk"></span>
    <div class="spider-hit" (click)="flee(spider.id)">
      <svg class="spider-svg" viewBox="0 0 64 72" focusable="false">
        <g class="legs" fill="none" stroke="#0b1228" stroke-width="3" stroke-linecap="round">
          <path d="M28 30 C12 22 8 10 6 6" />
          <path d="M26 34 C10 32 4 28 2 22" />
          <path d="M26 38 C10 42 4 48 3 54" />
          <path d="M28 42 C14 52 10 60 8 66" />
          <path d="M36 30 C52 22 56 10 58 6" />
          <path d="M38 34 C54 32 60 28 62 22" />
          <path d="M38 38 C54 42 60 48 61 54" />
          <path d="M36 42 C50 52 54 60 56 66" />
        </g>
        <ellipse cx="32" cy="46" rx="13" ry="16" [attr.fill]="spider.abdomen" stroke="#0b1228" stroke-width="2.5" />
        <ellipse cx="32" cy="43" rx="5" ry="7" fill="#f8fafc" opacity="0.28" />
        <ellipse cx="32" cy="28" rx="10" ry="9" [attr.fill]="spider.thorax" stroke="#0b1228" stroke-width="2.5" />
        <ellipse cx="28" cy="27" rx="4" ry="4.5" fill="#fff" stroke="#0b1228" stroke-width="1.2" />
        <ellipse cx="36" cy="27" rx="4" ry="4.5" fill="#fff" stroke="#0b1228" stroke-width="1.2" />
        <circle cx="29" cy="28" r="1.7" fill="#0b1228" />
        <circle cx="37" cy="28" r="1.7" fill="#0b1228" />
      </svg>
    </div>
  </div>
}
