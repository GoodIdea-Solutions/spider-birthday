<header class="site-header">
  <div class="header-bar">
    <a class="brand" routerLink="/" (click)="closeMenu()">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text">Samuel</span>
    </a>
    <button
      type="button"
      class="nav-toggle"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="site-nav"
      [attr.aria-label]="menuOpen() ? 'Fechar menu' : 'Abrir menu'"
      (click)="toggleMenu()"
    >
      <span class="nav-toggle-bars" [class.open]="menuOpen()" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </span>
    </button>
  </div>
  <nav
    id="site-nav"
    class="nav"
    [class.open]="menuOpen()"
    aria-label="Navegação principal"
  >
    <a routerLink="/" fragment="inicio" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="onFragmentClick($event, 'inicio')">Início</a>
    <a routerLink="/presentes" routerLinkActive="active" (click)="closeMenu()">Presentes</a>
    <a routerLink="/fotos" routerLinkActive="active" (click)="closeMenu()">Mural</a>
    <a routerLink="/hq" routerLinkActive="active" (click)="closeMenu()">Revista</a>
    <button type="button" class="nav-rsvp" (click)="openRsvp()">Confirmar presença</button>
  </nav>
</header>
