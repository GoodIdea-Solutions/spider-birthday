@if (shown()) {
  <div class="header-music" role="group" aria-label="Controle da música da festa">
    <a
      routerLink="/playlist"
      class="music-btn playlist-link"
      aria-label="Abrir playlist"
      data-tooltip="Abrir playlist"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path
          fill="currentColor"
          d="M12 3a1 1 0 0 1 1 1v10.06A3.5 3.5 0 1 1 11 17.5V8h6V6h-6V4a1 1 0 0 1 1-1Z"
        />
      </svg>
    </a>

    <button
      type="button"
      class="music-btn skip"
      aria-label="Música anterior"
      data-tooltip="Música anterior"
      (click)="skipPrevious()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path fill="currentColor" d="M6 6h2v12H6V6Zm11 12V6l-8.5 6 8.5 6Z" />
      </svg>
    </button>

    <button
      type="button"
      class="music-btn play"
      [class.needs-tap]="needsTap()"
      [attr.aria-label]="playLabel()"
      [attr.data-tooltip]="playLabel()"
      [attr.aria-pressed]="showPause()"
      (click)="toggle()"
    >
      @if (showPause()) {
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M7 5h3v14H7V5Zm7 0h3v14h-3V5Z" />
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M8 5.5v13l11-6.5L8 5.5Z" />
        </svg>
      }
    </button>

    <button
      type="button"
      class="music-btn skip"
      aria-label="Próxima música"
      data-tooltip="Próxima música"
      (click)="skipNext()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path fill="currentColor" d="M16 6h2v12h-2V6ZM7 18V6l8.5 6L7 18Z" />
      </svg>
    </button>

    <button
      type="button"
      class="music-btn repeat"
      [class.active]="repeat()"
      [attr.aria-label]="repeatLabel()"
      [attr.data-tooltip]="repeatLabel()"
      [attr.aria-pressed]="repeat()"
      (click)="toggleRepeat()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path
          fill="currentColor"
          d="M7 7h7.5V4.5L19 8l-4.5 3.5V9H7v4H5V7h2Zm10 10H9.5v2.5L5 16l4.5-3.5V15H17v-4h2v6h-2Z"
        />
        <path fill="currentColor" d="M11.15 10.2h1.7v5.1h-1.7z" />
      </svg>
    </button>

    <button
      type="button"
      class="music-btn volume"
      aria-label="Diminuir volume"
      data-tooltip="Diminuir volume"
      [disabled]="volumeAtMin()"
      (click)="volumeDown()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3Zm12 4h7v2h-7v-2Z" />
      </svg>
    </button>

    <button
      type="button"
      class="music-btn tip-end volume"
      aria-label="Aumentar volume"
      data-tooltip="Aumentar volume"
      [disabled]="volumeAtMax()"
      (click)="volumeUp()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3Zm13 1h2V8h2v2h2v2h-2v2h-2v-2h-2v-2Z" />
      </svg>
    </button>
  </div>
}
