<a class="skip-link" href="#conteudo-principal">Ir para o conteúdo</a>
@if (!captureMode() && !inviteMode()) {
  <app-header />
}
<main id="conteudo-principal" [class.capture]="captureMode()" [class.invite]="inviteMode()">
  <router-outlet />
</main>
@if (!captureMode() && !inviteMode()) {
  <app-footer />
  <app-fab-rsvp />
}
@if (!captureMode() && !inviteMode() && !adminMode()) {
  <app-spider-crawl />
}
@if (!captureMode()) {
  <app-rsvp-modal />
}
<app-bg-player />
