# Virtual host for the shared nginx+certbot stack at /opt/nginx.
# Copy/symlink this file into the nginx conf.d and reload nginx after first deploy.
# Update server_name (and TLS cert paths) to match your domain.

upstream spider_birthday_frontend {
    server spider-birthday-frontend:80;
}

server {
    listen 80;
    server_name spider-birthday.goodidea.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name spider-birthday.goodidea.com.br;

    # Adjust paths to match the certbot layout on the droplet
    ssl_certificate     /etc/letsencrypt/live/spider-birthday.goodidea.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spider-birthday.goodidea.com.br/privkey.pem;

    client_max_body_size 52m;

    location / {
        proxy_pass http://spider_birthday_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }
}
