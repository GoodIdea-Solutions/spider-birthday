services:
  postgres:
    image: postgres:16-alpine
    container_name: spider-birthday-db
    environment:
      POSTGRES_DB: aniversario
      POSTGRES_USER: aniversario
      POSTGRES_PASSWORD: aniversario
    ports:
      - "5432:5432"
    volumes:
      - spider_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aniversario -d aniversario"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  spider_pg_data:
